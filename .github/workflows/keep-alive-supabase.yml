name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *'   # todo dia, 9h no horário de Brasília
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ping Supabase database
        env:
          PGHOST: ${{ secrets.DATABASE_HOST }}
          PGPORT: ${{ secrets.DATABASE_PORT }}
          PGUSER: ${{ secrets.DATABASE_USER }}
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          PGDATABASE: ${{ secrets.DATABASE_NAME }}
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS keep_alive (
            id int PRIMARY KEY,
            last_ping timestamptz NOT NULL
          );
          INSERT INTO keep_alive (id, last_ping) VALUES (1, now())
            ON CONFLICT (id) DO UPDATE SET last_ping = now();
          SQL