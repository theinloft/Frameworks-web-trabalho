name: Keep API alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 60 \
            "${{ secrets.API_URL }}/health"