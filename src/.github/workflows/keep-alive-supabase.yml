name: Keep Supabase Alive

on:
  schedule:
    # Roda a cada 3 dias
    - cron: '0 0 */3 * *'
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          echo "Pingando o projeto Supabase..."
          response=$(curl -s -o response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$SUPABASE_TABLE?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Status HTTP: $response"
          cat response.txt

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo " Ping bem-sucedido, projeto está ativo."
          else
            echo "Ping falhou (status $response). Verifique as credenciais/URL."
            exit 1
          fi